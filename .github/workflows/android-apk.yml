name: Build Android APK

# پروژه به‌صورت یک فایل ZIP در ریشه‌ی مخزن قرار می‌گیرد. GitHub Actions فایل‌های داخل ZIP را اجرا نمی‌کند،
# پس همین فایل باید جداگانه در .github/workflows/ مخزن باشد. مراحل: استخراج ZIP ← نصب وابستگی‌ها ← تست JS ← sync ←
# تست Android ← ساخت APK ← انتشار APK (فقط اگر همه‌ی مراحل قبلی موفق باشند).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'keyhan-focus-project.zip'
      - '.github/workflows/android-apk.yml'

env:
  PROJECT_ZIP: keyhan-focus-project.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -euo pipefail
          zip_file="$PROJECT_ZIP"
          if [ ! -f "$zip_file" ]; then
            count=$(find . -maxdepth 1 -name '*.zip' | wc -l)
            if [ "$count" -eq 1 ]; then
              zip_file=$(find . -maxdepth 1 -name '*.zip')
            else
              echo "::error::Project ZIP '$PROJECT_ZIP' not found in the repository root (found $count zip files)."
              exit 1
            fi
          fi
          echo "Using $zip_file"
          rm -rf project && mkdir project
          unzip -q "$zip_file" -d project
          pkg=$(find project -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$pkg" ]; then echo "::error::package.json not found inside the ZIP"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$pkg")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # عمداً android-actions/setup-android استفاده نشده (خطای "Failed to find package 'tools'").
      # Android SDK روی runner ubuntu-24.04 از قبل نصب است (ANDROID_HOME).
      - name: Prepare Android SDK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install JS dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: JS tests (extension + Android UI)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test

      - name: Build web assets and sync into the Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run cap:sync

      - name: Android unit tests
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: ${{ env.PROJECT_DIR }}/android/app/build/reports/tests
          if-no-files-found: ignore

      # فقط وقتی همه‌ی تست‌ها موفق بوده‌اند به این‌جا می‌رسیم
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keyhan-focus-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
